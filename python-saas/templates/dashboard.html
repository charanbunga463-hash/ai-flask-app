<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#0f172a;
    color:#e2e8f0;
    font-family:'Segoe UI',sans-serif;
    margin:0;
}

/* ICON */
.main-icon{
    position:fixed;
    top:10px;
    left:10px;
    background:#1e293b;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    z-index:1100;
}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:#0f172a;
    border-right:1px solid #334155;
    height:100vh;
    position:fixed;
    left:-300px;
    transition:0.3s ease;
    padding:15px;
    display:flex;
    flex-direction:column;
    z-index:1000;
}
.sidebar.open{ left:0; }

.sidebar-content{
    flex:1;
    overflow-y:auto;
}

/* CHAT AREA */
.chat-area{
    display:flex;
    flex-direction:column;
    height:100vh;
    margin-left:0;
    transition:0.3s ease;
}

.input-area{
    padding:15px;
    border-top:1px solid #334155;
    background:#1e293b;
    transition:0.3s ease;
}

/* DESKTOP SHIFT */
body.sidebar-open .chat-area{
    margin-left:300px;
}

body.sidebar-open .input-area{
    margin-left:300px;
}

/* MESSAGES */
.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.user-box{
    background:#1e40af;
    padding:10px;
    border-radius:10px;
    text-align:right;
    margin-top:10px;
}

.response-box{
    background:#020617;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    border:1px solid #334155;
}

/* SEARCH */
.search-box{ margin-top:10px; }

.history-box{
    background:#1e293b;
    padding:10px;
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
}
.history-box:hover{ background:#334155; }

/* HEADER */
.sidebar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* FOOTER */
.sidebar-footer{
    border-top:1px solid #334155;
    padding-top:10px;
}

/* HIGHLIGHT */
.highlight{
    background:yellow;
    color:black;
    padding:2px;
    border-radius:3px;
}

/* FILE MENU */
.file-menu{
    position:absolute;
    bottom:45px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:10px;
    display:none;
}
.file-menu button{
    width:100%;
    background:none;
    border:none;
    color:white;
    padding:8px;
}

/* CLOSE BTN */
.close-btn{
    background:none;
    border:none;
    color:white;
    font-size:18px;
}

/* =========================
   📱 MOBILE DRAWER UI
========================= */

.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    z-index:900;
}

.overlay.show{
    display:block;
}

@media (max-width:768px){

    .sidebar{
        width:85%;
        max-width:320px;
    }

    /* disable desktop shift */
    body.sidebar-open .chat-area,
    body.sidebar-open .input-area{
        margin-left:0;
    }
}
</style>
</head>

<body>

<div id="overlay" class="overlay"></div>

<div id="mainIcon" class="main-icon">🤖</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

    <div class="sidebar-header">
        <h5>Chats</h5>
        <button class="close-btn" onclick="closeSidebar()">✖</button>
    </div>

    <div class="sidebar-content">

        <a href="/new_chat" class="btn btn-primary w-100 mt-2">+ New Chat</a>

        <input id="searchBox" class="form-control search-box" placeholder="Search messages...">

        <div id="searchResults"></div>

        <div id="chatHistory">
        {% for conv in conversations %}
            <div class="history-box">
                <a href="/chat/{{ conv[0] }}" style="color:white;text-decoration:none;flex:1;">
                    {{ conv[1] }}
                </a>

                <form method="POST" action="/delete_chat/{{ conv[0] }}">
                    <button class="close-btn">🗑</button>
                </form>
            </div>
        {% endfor %}
        </div>

    </div>

    <div class="sidebar-footer">
        <a href="/logout" class="btn btn-outline-danger w-100">Logout</a>
    </div>

</div>

<!-- CHAT -->
<div class="chat-area">

<div id="chatBox" class="messages">

{% for msg in chat %}

<div class="user-box message"
     id="msg-{{ msg.id }}"
     data-text="{{ msg.user | e }}">
    {{ msg.user }}
</div>

{% if msg.type == "text" %}
<div class="response-box message"
     id="msg-{{ msg.id }}"
     data-text="{{ msg.bot | striptags | e }}">
    {{ msg.bot | safe }}
</div>
{% endif %}

{% if msg.type == "image" %}
<div class="response-box text-center"
     id="msg-{{ msg.id }}">
    <img src="{{ msg.image }}" style="max-width:100%;">
</div>
{% endif %}

{% endfor %}

</div>

<!-- INPUT -->
<div class="input-area">
<form method="POST" action="/tool" enctype="multipart/form-data">
<div class="input-group">

<button type="button" class="btn btn-outline-light">➕</button>

<input class="form-control" id="chatInput" name="input" placeholder="Ask anything...">

<button class="btn btn-primary">Send</button>

</div>
</form>
</div>

</div>

<script>

const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");

/* OPEN SIDEBAR */
document.getElementById("mainIcon").onclick=()=>{
    sidebar.classList.add("open");
    document.body.classList.add("sidebar-open");

    if(window.innerWidth<=768){
        overlay.classList.add("show");
    }
};

/* CLOSE SIDEBAR */
function closeSidebar(){
    sidebar.classList.remove("open");
    document.body.classList.remove("sidebar-open");
    overlay.classList.remove("show");
}

overlay.onclick=closeSidebar;

/* SEARCH */
searchBox.oninput=async ()=>{
    let q=searchBox.value.trim();

    if(q.length<2){
        searchResults.innerHTML="";
        chatHistory.style.display="block";
        return;
    }

    chatHistory.style.display="none";

    let res=await fetch(`/search?q=${encodeURIComponent(q)}`);
    let data=await res.json();

    let html="";

    data.results.forEach(r=>{
        let text=r.snippet.replace(
            new RegExp(`(${q})`,"gi"),
            `<span class="highlight">$1</span>`
        );

        html+=`
        <div class="history-box"
             onclick="openChat(${r.conv_id},${r.msg_id},'${q}')">
            ${text}
        </div>`;
    });

    searchResults.innerHTML=html;
}

function openChat(c,m,q){
    location.href=`/chat/${c}?msg=${m}&q=${encodeURIComponent(q)}`;
}

/* JUMP + HIGHLIGHT */
window.onload=()=>{
    let p=new URLSearchParams(location.search);
    let msg=p.get("msg");
    let q=p.get("q");

    if(msg){
        let el=document.getElementById("msg-"+msg);

        if(el){
            el.scrollIntoView({behavior:"smooth",block:"center"});
            highlight(el,q);
            el.style.border="2px solid yellow";
            setTimeout(()=>el.style.border="",2000);
        }
    }else{
        chatBox.scrollTop=chatBox.scrollHeight;
    }
};

function highlight(el,q){
    if(!q) return;

    let regex=new RegExp(`(${q})`,"gi");

    function walk(node){
        if(node.nodeType===3){
            if(node.nodeValue.toLowerCase().includes(q.toLowerCase())){
                let span=document.createElement("span");
                span.innerHTML=node.nodeValue.replace(regex,
                    `<span class="highlight">$1</span>`);
                node.replaceWith(span);
            }
        }else{
            node.childNodes.forEach(walk);
        }
    }

    walk(el);
}

</script>

</body>
</html>

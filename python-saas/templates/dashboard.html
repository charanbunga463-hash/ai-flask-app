<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Intelligent Interface</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            /* Professional Dark Color Palette */
            --bg-main: #09090b;
            --bg-sidebar: #121214;
            --bg-card: #18181b;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --border-subtle: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --user-msg-bg: #3b82f6;
            --sidebar-width: 280px;
            --transition-speed: 0.3s;
        }

        /* Base Reset & Layout */
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Component */
        .sidebar { 
            width: var(--sidebar-width); 
            background: var(--bg-sidebar); 
            border-right: 1px solid var(--border-subtle); 
            height: 100vh; 
            position: fixed; 
            left: calc(var(--sidebar-width) * -1); 
            transition: transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1050; 
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }
        .sidebar.open { transform: translateX(var(--sidebar-width)); }

        /* Navigation Controls */
        .menu-trigger { 
            position: fixed; top: 1.25rem; left: 1.25rem; 
            background: var(--bg-card); 
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 0.6rem; 
            border-radius: 10px; 
            cursor: pointer; 
            z-index: 1100;
            transition: all 0.2s ease;
        }
        .menu-trigger:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

        /* Main Content Container */
        .viewport { 
            flex: 1;
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            width: 100%; 
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            transition: filter var(--transition-speed);
        }
        body.sidebar-open .viewport { filter: blur(2px); pointer-events: none; }

        /* Chat Message Area */
        .chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 80px 1.5rem 2rem; 
            scrollbar-width: thin;
            scrollbar-color: var(--border-subtle) transparent;
        }

        .message-wrapper { margin-bottom: 2rem; display: flex; flex-direction: column; }

        .msg-user { 
            align-self: flex-end; 
            background: var(--user-msg-bg); 
            padding: 0.8rem 1.2rem; 
            border-radius: 18px 18px 2px 18px; 
            max-width: 85%;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
        }

        .msg-ai { 
            align-self: flex-start; 
            width: 100%;
            padding: 0.5rem 1rem;
            border-left: 3px solid var(--border-subtle);
            transition: border-color 0.3s;
        }
        .msg-ai:hover { border-left-color: var(--accent-primary); }

        /* Professional Input Bar */
        .input-footer { 
            padding: 1.5rem 1.5rem 2.5rem; 
            background: linear-gradient(0deg, var(--bg-main) 70%, transparent 100%);
        }

        .composer-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        .composer-card:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        .composer-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            flex: 1;
            padding: 0.75rem;
            outline: none;
            font-size: 1rem;
        }

        /* Action Buttons */
        .icon-btn { 
            color: var(--text-muted); 
            background: none; 
            border: none; 
            padding: 8px; 
            border-radius: 8px;
            transition: 0.2s;
        }
        .icon-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        
        .send-btn { 
            background: var(--accent-primary); 
            border: none; 
            border-radius: 10px; 
            color: white; 
            padding: 0.5rem 1.2rem; 
            font-weight: 600;
            margin-left: 0.5rem;
        }
        .send-btn:hover { background: var(--accent-hover); }

        /* History Items */
        .nav-item { 
            background: transparent; 
            padding: 0.75rem 1rem; 
            border-radius: 10px; 
            margin-bottom: 0.5rem; 
            display: flex; 
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }

        @media (min-width: 1200px) {
            .sidebar { left: 0; }
            .viewport { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); }
            .menu-trigger { display: none; }
            body.sidebar-open .viewport { filter: none; pointer-events: auto; }
        }
    </style>
</head>
<body>

<button id="menuTrigger" class="menu-trigger" aria-label="Toggle Sidebar">
    <i class="bi bi-list fs-4"></i>
</button>

<aside id="sidebar" class="sidebar">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h6 class="mb-0 fw-bold tracking-widest text-uppercase small opacity-75">Workspace</h6>
        <button class="icon-btn d-xl-none" onclick="toggleSidebar()"><i class="bi bi-x-lg"></i></button>
    </div>

    <div class="flex-grow-1 overflow-auto">
        <a href="/new_chat" class="btn btn-outline-secondary w-100 mb-4 py-2 text-start d-flex align-items-center" style="border-radius: 12px;">
            <i class="bi bi-plus-lg me-2"></i> New Session
        </a>
        
        <nav id="chatHistory">
            {% for conv in conversations %}
            <div class="nav-item">
                <i class="bi bi-chat-left me-3 opacity-50"></i>
                <a href="/chat/{{ conv[0] }}" class="text-truncate flex-grow-1 text-decoration-none color-inherit">{{ conv[1] }}</a>
                <i class="bi bi-three-dots opacity-50 cursor-pointer"></i>
            </div>
            {% endfor %}
        </nav>
    </div>

    <div class="pt-3 border-top border-secondary">
        <a href="/logout" class="nav-item text-danger mb-0">
            <i class="bi bi-box-arrow-right me-2"></i> Sign Out
        </a>
    </div>
</aside>

<main class="viewport">
    <div id="chatBox" class="chat-container d-flex flex-column">
        {% for msg in chat %}
        <div class="message-wrapper">
            <div class="{{ 'msg-user' if msg.role == 'user' else 'msg-ai' }}">
                {% if msg.type == "text" %}
                    <div class="content-text">{{ msg.bot | safe }}</div>
                {% endif %}
                
                {% if msg.type == "image" %}
                    <img src="{{ msg.image }}" alt="Generated Content" class="img-fluid rounded-4 mt-3 border border-dark shadow-lg">
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>

    <section class="input-footer">
        <form method="POST" action="/tool" enctype="multipart/form-data" id="chatForm">
            <div class="composer-card">
                <label for="fileInput" class="icon-btn" title="Upload Media">
                    <i class="bi bi-paperclip fs-5"></i>
                    <input type="file" id="fileInput" name="file" hidden>
                </label>

                <input type="text" id="chatInput" name="input" 
                       placeholder="Message Nexus AI..." 
                       autocomplete="off" 
                       class="composer-input">
                
                <button type="button" id="micBtn" class="icon-btn" title="Voice Input">
                    <i class="bi bi-mic fs-5"></i>
                </button>

                <button type="submit" class="send-btn">
                    <span class="d-none d-md-inline">Send</span>
                    <i class="bi bi-send-fill d-md-none"></i>
                </button>
            </div>
        </form>
    </section>
</main>

<script>
    const sidebar = document.getElementById("sidebar");
    const menuTrigger = document.getElementById("menuTrigger");
    const chatBox = document.getElementById("chatBox");
    const chatInput = document.getElementById("chatInput");

    // Toggle Sidebar Functionality
    function toggleSidebar() {
        sidebar.classList.toggle("open");
        document.body.classList.toggle("sidebar-open");
    }

    menuTrigger.addEventListener('click', toggleSidebar);

    // Auto-scroll to latest message
    const scrollToBottom = () => {
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    };
    window.addEventListener('load', scrollToBottom);

    // Voice Recognition Logic
    const micBtn = document.getElementById("micBtn");
    let isRecording = false;

    micBtn.onclick = () => {
        if (!('webkitSpeechRecognition' in window)) {
            return alert("Voice features require Chrome or Edge.");
        }

        const recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isRecording = true;
            micBtn.style.color = "#ef4444";
            chatInput.placeholder = "Listening...";
        };

        recognition.onresult = (event) => {
            chatInput.value = event.results[0][0].transcript;
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.style.color = "var(--text-muted)";
            chatInput.placeholder = "Message Nexus AI...";
        };

        recognition.start();
    };

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") {
            sidebar.classList.remove("open");
            document.body.classList.remove("sidebar-open");
        }
    });

    // Form Handling (Optional: prevent empty submits)
    document.getElementById('chatForm').onsubmit = (e) => {
        if (!chatInput.value.trim() && !document.getElementById('fileInput').files.length) {
            e.preventDefault();
        }
    };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#0f172a;
    color:#e2e8f0;
    font-family:'Segoe UI',sans-serif;
}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:#0f172a;
    border-right:1px solid #334155;
    height:100vh;
    position:fixed;
    left:-300px;
    transition:.3s;
    padding:15px;
    display:flex;
    flex-direction:column;
}
.sidebar.open{ left:0; }

.sidebar-content{ flex:1; overflow-y:auto; }

.main-icon{
    position:fixed;
    top:10px;
    left:10px;
    background:#1e293b;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    z-index:1000;
}

/* CHAT */
.chat-area{
    display:flex;
    flex-direction:column;
    height:100vh;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.user-box{
    background:#1e40af;
    padding:10px;
    border-radius:10px;
    text-align:right;
    margin-top:10px;
}

.response-box{
    background:#020617;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    border:1px solid #334155;
}

/* SEARCH PANEL (ChatGPT style) */
.search-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.search-counter{
    font-size:12px;
    color:#94a3b8;
}

.nav-btn{
    background:#1e293b;
    border:none;
    color:white;
    padding:4px 8px;
    border-radius:6px;
}

/* SEARCH RESULTS */
.search-box{
    margin-top:10px;
}

.history-box{
    background:#1e293b;
    padding:10px;
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
}
.history-box:hover{ background:#334155; }

.highlight{
    background:yellow;
    color:black;
    padding:2px;
    border-radius:3px;
}

/* FOOTER */
.sidebar-footer{
    border-top:1px solid #334155;
    padding-top:10px;
}

/* INPUT */
.input-area{
    padding:15px;
    border-top:1px solid #334155;
    background:#1e293b;
}

.file-menu{
    position:absolute;
    bottom:45px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:10px;
    display:none;
}
.file-menu button{
    width:100%;
    background:none;
    border:none;
    color:white;
    padding:8px;
}

</style>
</head>

<body>

<div id="mainIcon" class="main-icon">🤖</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

    <h5>Chats</h5>

    <div class="sidebar-content">

        <a href="/new_chat" class="btn btn-primary w-100">+ New Chat</a>

        <!-- SEARCH -->
        <input id="searchBox" class="form-control search-box mt-2" placeholder="Search messages...">

        <!-- CHATGPT STYLE HEADER -->
        <div class="search-header">
            <button class="nav-btn" onclick="prevMatch()">⬆</button>

            <span class="search-counter" id="counter">0 / 0</span>

            <button class="nav-btn" onclick="nextMatch()">⬇</button>
        </div>

        <div id="searchResults"></div>

        <div id="chatHistory">
        {% for conv in conversations %}
            <div class="history-box">
                <a href="/chat/{{ conv[0] }}" style="color:white;text-decoration:none;">
                    {{ conv[1] }}
                </a>
            </div>
        {% endfor %}
        </div>

    </div>

    <div class="sidebar-footer">
        <a href="/logout" class="btn btn-outline-danger w-100">Logout</a>
    </div>

</div>

<!-- CHAT -->
<div class="chat-area">

<div id="chatBox" class="messages">

{% for msg in chat %}

<div class="user-box message"
     id="msg-{{ msg.id }}"
     data-text="{{ msg.user | e }}">
    {{ msg.user }}
</div>

{% if msg.type == "text" %}
<div class="response-box message"
     id="msg-{{ msg.id }}"
     data-text="{{ msg.bot | striptags | e }}">
    {{ msg.bot | safe }}
</div>
{% endif %}

{% if msg.type == "image" %}
<div class="response-box text-center"
     id="msg-{{ msg.id }}">
    <img src="{{ msg.image }}" style="max-width:100%;">
</div>
{% endif %}

{% endfor %}

</div>

<div class="input-area">
<form method="POST" action="/tool" enctype="multipart/form-data">
<div class="input-group">

<button type="button" onclick="toggleMenu()" class="btn btn-outline-light">➕</button>

<input type="file" id="fileInput" name="file" class="d-none">

<input class="form-control" id="chatInput" name="input" placeholder="Ask anything...">

<button class="btn btn-primary">Send</button>

</div>
</form>

<div id="fileMenu" class="file-menu">
<button onclick="openFile()">📄 Upload File</button>
<button onclick="openImage()">🖼 Upload Image</button>
</div>

</div>

</div>

<script>

const sidebar=document.getElementById("sidebar");
document.getElementById("mainIcon").onclick=()=>sidebar.classList.add("open");

/* =========================
   🔍 SEARCH ENGINE CORE
========================= */

let matches = [];
let current = -1;

searchBox.oninput = async () => {
    let q = searchBox.value.trim();

    if(q.length < 2){
        searchResults.innerHTML="";
        chatHistory.style.display="block";
        matches=[];
        updateCounter();
        return;
    }

    chatHistory.style.display="none";

    // instant highlight in current chat
    liveHighlight(q);

    let res = await fetch(`/search?q=${encodeURIComponent(q)}`);
    let data = await res.json();

    matches = data.results || [];
    current = matches.length ? 0 : -1;

    renderResults(q);
    updateCounter();
};

/* =========================
   📌 RENDER RESULTS
========================= */

function renderResults(q){
    let html="";

    matches.forEach((r,i)=>{
        let text = r.snippet.replace(
            new RegExp(`(${q})`,"gi"),
            `<span class="highlight">$1</span>`
        );

        html += `
        <div class="history-box" onclick="openMatch(${i})">
            ${text}...
        </div>`;
    });

    searchResults.innerHTML = html;
}

/* =========================
   🎯 OPEN MATCH
========================= */

function openMatch(index){
    let r = matches[index];
    if(!r) return;

    let q = encodeURIComponent(searchBox.value);

    location.href = `/chat/${r.conv_id}?msg=${r.msg_id}&q=${q}`;
}

/* =========================
   ⬆⬇ NAVIGATION
========================= */

function nextMatch(){
    if(matches.length === 0) return;

    current = (current + 1) % matches.length;
    openMatch(current);
}

function prevMatch(){
    if(matches.length === 0) return;

    current = (current - 1 + matches.length) % matches.length;
    openMatch(current);
}

/* =========================
   🔢 COUNTER
========================= */

function updateCounter(){
    document.getElementById("counter").innerText =
        matches.length ? `${current+1} / ${matches.length}` : "0 / 0";
}

/* =========================
   ⚡ LIVE HIGHLIGHT
========================= */

function liveHighlight(q){
    document.querySelectorAll(".message").forEach(el=>{
        let text = el.dataset.text || "";
        el.innerHTML = text;

        if(q.length < 2) return;

        let regex = new RegExp(`(${q})`, "gi");
        el.innerHTML = el.innerHTML.replace(regex,
            `<span class="highlight">$1</span>`);
    });
}

/* =========================
   🎯 JUMP ON LOAD
========================= */

window.onload = () => {
    let p = new URLSearchParams(location.search);
    let msg = p.get("msg");
    let q = p.get("q");

    if(msg){
        let el = document.getElementById("msg-"+msg);

        if(el){
            el.scrollIntoView({behavior:"smooth",block:"center"});
            liveHighlight(q);
            el.style.border="2px solid yellow";
            setTimeout(()=>el.style.border="",2000);
        }
    }
};

/* FILE MENU */
function toggleMenu(){
    fileMenu.style.display = fileMenu.style.display==="block"?"none":"block";
}
function openFile(){
    fileInput.accept=".pdf";
    fileInput.click();
}
function openImage(){
    fileInput.accept="image/*";
    fileInput.click();
}

</script>

</body>
</html>

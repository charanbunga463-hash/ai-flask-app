<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
}

/* ICON */
.main-icon {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 22px;
    background: #1e293b;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    z-index: 1100;
}

/* SIDEBAR */
.sidebar {
    width: 280px;
    background-color: #0f172a;
    border-right: 1px solid #334155;
    height: 100vh;
    position: fixed;
    left: -280px;
    top: 0;
    transition: 0.3s;
    z-index: 1000;
    padding: 15px;
    overflow-y: auto;
}
.sidebar.open { left: 0; }

/* CHAT */
.chat-area {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.top-bar {
    padding: 10px 15px;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.input-area {
    padding: 15px;
    border-top: 1px solid #334155;
    background-color: #1e293b;
}

/* Bubbles */
.user-box {
    background-color: #1e40af;
    padding: 10px;
    border-radius: 10px;
    text-align: right;
    margin-top: 10px;
}

.response-box {
    background-color: #020617;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    border: 1px solid #334155;
}

.input-box {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: white;
}

.btn-ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

/* HISTORY */
.history-box {
    background-color: #1e293b;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
}
.history-box.active { background-color: #334155; }

.chat-title { flex: 1; }
.rename-input { display: none; flex: 1; }

.mic-active {
    background: red !important;
    color: white !important;
}
</style>
</head>

<body>

<!-- ICON -->
<div id="mainIcon" class="main-icon"
     onclick="openSidebar()"
     onmouseenter="hoverIcon(true)"
     onmouseleave="hoverIcon(false)">🤖</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

    <div class="d-flex justify-content-between mb-3">
        <h5>🕘 Chats</h5>
        <button class="btn btn-sm btn-outline-light" onclick="closeSidebar()">📜</button>
    </div>

    <a href="/new_chat" class="btn btn-sm btn-primary w-100 mb-3">+ New Chat</a>

    {% for conv in conversations %}
    <div class="history-box {% if conv[0] == active_chat %}active{% endif %}">

        <div class="chat-title" id="title-{{ conv[0] }}">
            <a href="/chat/{{ conv[0] }}" style="color:white;text-decoration:none;">
                {{ conv[1] }}
            </a>
        </div>

        <input type="text"
               id="input-{{ conv[0] }}"
               class="form-control form-control-sm rename-input"
               value="{{ conv[1] }}"
               onkeydown="handleRename(event,'{{ conv[0] }}')">

        <div class="dropdown ms-2">
            <button class="btn btn-sm text-white" data-bs-toggle="dropdown">⋯</button>
            <ul class="dropdown-menu dropdown-menu-dark">
                <li>
                    <button class="dropdown-item"
                            onclick="enableRename('{{ conv[0] }}')">Rename</button>
                </li>
                <li>
                    <form method="POST" action="/delete_chat/{{ conv[0] }}">
                        <button class="dropdown-item text-danger">Delete</button>
                    </form>
                </li>
            </ul>
        </div>

    </div>
    {% endfor %}
</div>

<!-- CHAT -->
<div class="chat-area">

    <div class="top-bar">
        <h5>AI Assistant</h5>
        <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
    </div>

    <div class="messages" id="chatBox">
        {% for msg in chat %}
        <div class="user-box">{{ msg.user }}</div>

        {% if msg.type == "text" %}
        <div class="response-box">{{ msg.bot | safe }}</div>
        {% endif %}

        {% if msg.type == "image" %}
        <div class="response-box text-center">
            <img src="{{ msg.image }}" style="max-width:100%; border-radius:10px;">
        </div>
        {% endif %}
        {% endfor %}
    </div>

    <!-- INPUT -->
    <div class="input-area">
        <form onsubmit="sendMessage(event)">
            <div class="input-group">

                <input class="form-control input-box"
                       id="chatInput"
                       placeholder="Ask anything..."
                       required>

                <button type="button"
                        id="micBtn"
                        class="btn btn-outline-light"
                        onclick="startListening()">🎤</button>

                <button class="btn btn-ai text-white">Send</button>

            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// Sidebar logic
let isOpen = false;
function hoverIcon(e){ if(!isOpen) mainIcon.innerHTML = e?"📜":"🤖"; }
function openSidebar(){ isOpen=true; sidebar.classList.add("open"); mainIcon.innerHTML="📜"; }
function closeSidebar(){ isOpen=false; sidebar.classList.remove("open"); mainIcon.innerHTML="🤖"; }

// Auto scroll
window.onload = () => chatBox.scrollTop = chatBox.scrollHeight;

// Rename
function enableRename(id){
    title = document.getElementById("title-"+id);
    input = document.getElementById("input-"+id);
    title.style.display="none";
    input.style.display="block";
    input.focus();
}
function handleRename(e,id){
    if(e.key==="Enter"){
        let val=e.target.value.trim();
        if(!val) return;
        let f=document.createElement("form");
        f.method="POST"; f.action="/edit_chat/"+id;
        let i=document.createElement("input");
        i.type="hidden"; i.name="title"; i.value=val;
        f.appendChild(i); document.body.appendChild(f); f.submit();
    }
}

// 🎤 Voice
let recognition, isListening=false;
function startListening(){
    const btn = micBtn;
    if(!('webkitSpeechRecognition'in window)){ alert("No voice"); return; }

    if(isListening){
        recognition.stop(); btn.classList.remove("mic-active"); isListening=false; return;
    }

    recognition = new webkitSpeechRecognition();
    recognition.lang="en-US";
    recognition.start();

    btn.classList.add("mic-active");
    isListening=true;

    recognition.onresult = e => chatInput.value = e.results[0][0].transcript;
    recognition.onend = () => { btn.classList.remove("mic-active"); isListening=false; };
}

// 🔥 STREAMING
async function sendMessage(e){
    e.preventDefault();

    let input = chatInput.value.trim();
    if(!input) return;

    chatBox.innerHTML += `<div class="user-box">${input}</div>`;

    let botDiv = document.createElement("div");
    botDiv.className="response-box";
    chatBox.appendChild(botDiv);

    chatInput.value="";
    chatBox.scrollTop = chatBox.scrollHeight;

    const res = await fetch("/stream",{
        method:"POST",
        body:new URLSearchParams({input})
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while(true){
        const {done,value} = await reader.read();
        if(done) break;

        botDiv.innerHTML += decoder.decode(value);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}
</script>

</body>
</html>

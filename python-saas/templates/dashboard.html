<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
}

/* Center mode */
.center-mode {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Chat mode */
.chat-container {
    max-width: 800px;
    margin: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.input-area {
    padding: 15px;
    border-top: 1px solid #334155;
    background-color: #1e293b;
}

.card {
    background-color: #1e293b;
    border-radius: 15px;
}

.input-box {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: white;
}

.btn-ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

.response-box {
    background-color: #020617;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
    border: 1px solid #ffffff;
}

/* Markdown styling */
.response-box ul {
    padding-left: 20px;
}

.response-box li {
    margin-bottom: 6px;
}

.small-text {
    font-size: 14px;
    color: #fff;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
</style>
</head>

<body>

{% if not output and not image %}
<!-- 🔵 CENTER MODE -->
<div class="center-mode">

  <div class="card p-4" style="width:100%; max-width:600px;">
    
    <div class="text-center mb-3">
      <h4>🤖 AI Assistant</h4>
      <p class="small-text">Welcome {{user}}</p>
    </div>

    <form method="POST" action="/tool">
      <div class="input-group">
        <input class="form-control input-box" name="input" placeholder="Ask anything..." required>
        <button class="btn btn-ai text-white">Send</button>
      </div>
    </form>

  </div>

</div>

{% else %}
<!-- 🟢 CHAT MODE -->
<div class="chat-container">

  <!-- Header -->
  <div class="p-3">
    <div class="header">
      <div>
        <h4 style="color:#ffffff;">🤖 AI Assistant</h4>
        <span class="small-text">Welcome {{user}}</span>
      </div>
      <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages">

    {% if output %}
    <div class="response-box">
      {{ output | safe }}
    </div>
    {% endif %}

    {% if image %}
    <div class="response-box text-center">
      <img src="{{ image }}" style="max-width:100%; border-radius:10px;">
    </div>
    {% endif %}

  </div>

  <!-- Input -->
  <div class="input-area">
    <form method="POST" action="/tool">
      <div class="input-group">
        <input class="form-control input-box" name="input" placeholder="Ask anything..." required>
        <button class="btn btn-ai text-white">Send</button>
      </div>
    </form>
  </div>

</div>
{% endif %}

</body>
</html>

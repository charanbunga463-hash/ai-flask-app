<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#0f172a;
    color:#e2e8f0;
    font-family:'Segoe UI',sans-serif;
}

/* ICON */
.main-icon{
    position:fixed;
    top:10px;
    left:10px;
    font-size:22px;
    background:#1e293b;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    z-index:1100;
}

/* SIDEBAR */
.sidebar{
    width:280px;
    background:#0f172a;
    border-right:1px solid #334155;
    height:100vh;
    position:fixed;
    left:-280px;
    top:0;
    transition:.3s;
    z-index:1000;
    padding:15px;
    overflow-y:auto;
}
.sidebar.open{ left:0; }

/* CHAT */
.chat-area{
    display:flex;
    flex-direction:column;
    height:100vh;
}

.top-bar{
    padding:10px 15px;
    border-bottom:1px solid #334155;
    display:flex;
    justify-content:space-between;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

/* INPUT */
.input-area{
    padding:15px;
    border-top:1px solid #334155;
    background:#1e293b;
}

/* BUBBLES */
.user-box{
    background:#1e40af;
    padding:10px;
    border-radius:10px;
    text-align:right;
    margin-top:10px;
}
.response-box{
    background:#020617;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    border:1px solid #334155;
}

/* INPUT */
.input-box{
    background:#0f172a;
    border:1px solid #334155;
    color:white;
}

/* HISTORY */
.history-box{
    background:#1e293b;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
}
.history-box.active{ background:#334155; }

.chat-title{ flex:1; }
.rename-input{ display:none; flex:1; }

/* SEARCH */
.search-box{
    margin-bottom:10px;
}

/* FILE MENU */
.file-menu{
    position:absolute;
    bottom:45px;
    left:0;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:10px;
    padding:5px;
    display:flex;
    flex-direction:column;
}
.file-menu button{
    background:none;
    border:none;
    color:white;
    padding:8px;
    text-align:left;
}
.file-menu button:hover{
    background:#334155;
}

/* MIC */
.mic-active{
    background:red !important;
    color:white !important;
}
</style>
</head>

<body>

<div id="mainIcon" class="main-icon">🤖</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

    <div class="d-flex justify-content-between mb-2">
        <h5>Chats</h5>
        <button class="btn btn-sm btn-outline-light" id="closeBtn">✖</button>
    </div>

    <!-- SEARCH -->
    <input type="text" id="searchBox" class="form-control search-box" placeholder="Search chats...">

    <div id="chatList">
        {% for conv in conversations %}
        <div class="history-box {% if conv[0] == active_chat %}active{% endif %}">
            
            <div class="chat-title" id="title-{{ conv[0] }}">
                <a href="/chat/{{ conv[0] }}" style="color:white;text-decoration:none;">
                    {{ conv[1] }}
                </a>
            </div>

            <input type="text"
                id="input-{{ conv[0] }}"
                class="form-control form-control-sm rename-input"
                value="{{ conv[1] }}"
                onkeydown="handleRename(event,'{{ conv[0] }}')">

            <div class="dropdown ms-2">
                <button class="btn btn-sm text-white" data-bs-toggle="dropdown">⋯</button>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><button class="dropdown-item"
                        onclick="enableRename('{{ conv[0] }}')">Rename</button></li>
                    <li>
                        <form method="POST" action="/delete_chat/{{ conv[0] }}">
                            <button class="dropdown-item text-danger">Delete</button>
                        </form>
                    </li>
                </ul>
            </div>

        </div>
        {% endfor %}
    </div>

    <a href="/new_chat" class="btn btn-primary w-100 mt-2">+ New Chat</a>

</div>

<!-- CHAT -->
<div class="chat-area">

    <div class="top-bar">
        <h5>AI Assistant</h5>
        <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
    </div>

    <div class="messages" id="chatBox">
        {% for msg in chat %}
            <div class="user-box">{{ msg.user }}</div>

            {% if msg.type == "text" %}
                <div class="response-box">{{ msg.bot | safe }}</div>
            {% endif %}

            {% if msg.type == "image" %}
                <div class="response-box text-center">
                    <img src="{{ msg.image }}" style="max-width:100%; border-radius:10px;">
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <div class="input-area">
        <form method="POST" action="/tool" enctype="multipart/form-data">
            <div class="input-group">

                <button type="button" class="btn btn-outline-light" onclick="toggleMenu()">➕</button>

                <input type="file" id="fileInput" name="file" class="d-none">

                <input class="form-control input-box"
                       id="chatInput"
                       name="input"
                       placeholder="Ask anything...">

                <button type="button" id="micBtn" class="btn btn-outline-light">🎤</button>
                <button class="btn btn-primary">Send</button>

            </div>
        </form>

        <div id="fileMenu" class="file-menu d-none">
            <button onclick="openFile()">📄 Upload File</button>
            <button onclick="openImage()">🖼 Upload Image</button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// SIDEBAR
const sidebar = document.getElementById("sidebar");
document.getElementById("mainIcon").onclick = () => sidebar.classList.add("open");
document.getElementById("closeBtn").onclick = () => sidebar.classList.remove("open");

// AUTO SCROLL
window.onload = () => {
    let box = document.getElementById("chatBox");
    if(box) box.scrollTop = box.scrollHeight;
};

// SEARCH FILTER (frontend only)
document.getElementById("searchBox").addEventListener("input", function(){
    let q = this.value.toLowerCase();
    document.querySelectorAll(".history-box").forEach(box => {
        let text = box.innerText.toLowerCase();
        box.style.display = text.includes(q) ? "flex" : "none";
    });
});

// FILE MENU
function toggleMenu(){
    document.getElementById("fileMenu").classList.toggle("d-none");
}
function openFile(){
    let f = document.getElementById("fileInput");
    f.accept = ".pdf";
    f.click();
}
function openImage(){
    let f = document.getElementById("fileInput");
    f.accept = "image/*";
    f.click();
}

// VOICE
let recognition, isListening=false;
const micBtn = document.getElementById("micBtn");

micBtn.onclick = () => {
    if(!('webkitSpeechRecognition' in window)){
        alert("Voice not supported");
        return;
    }

    if(isListening){
        recognition.stop();
        return;
    }

    recognition = new webkitSpeechRecognition();
    recognition.start();

    micBtn.classList.add("mic-active");
    isListening = true;

    recognition.onresult = e => {
        chatInput.value = e.results[0][0].transcript;
    };

    recognition.onend = () => {
        micBtn.classList.remove("mic-active");
        isListening = false;
    };
};

// RENAME
function enableRename(id){
    document.getElementById("title-"+id).style.display="none";
    let input=document.getElementById("input-"+id);
    input.style.display="block";
    input.focus();
}

function handleRename(e,id){
    if(e.key==="Enter"){
        let val=e.target.value.trim();
        if(!val) return;

        let form=document.createElement("form");
        form.method="POST";
        form.action="/edit_chat/"+id;

        let inp=document.createElement("input");
        inp.type="hidden";
        inp.name="title";
        inp.value=val;

        form.appendChild(inp);
        document.body.appendChild(form);
        form.submit();
    }
}

</script>

</body>
</html>

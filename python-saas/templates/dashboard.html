<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#0f172a;
    color:#e2e8f0;
    font-family:'Segoe UI',sans-serif;
}

/* SIDEBAR */
.sidebar{
    width:280px;
    background:#0f172a;
    border-right:1px solid #334155;
    height:100vh;
    position:fixed;
    left:-280px;
    transition:.3s;
    padding:15px;
    display:flex;
    flex-direction:column;
}
.sidebar.open{ left:0; }

.sidebar-content{ flex:1; overflow-y:auto; }

.main-icon{
    position:fixed;
    top:10px;
    left:10px;
    background:#1e293b;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
}

/* CHAT */
.chat-area{
    display:flex;
    flex-direction:column;
    height:100vh;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.user-box{
    background:#1e40af;
    padding:10px;
    border-radius:10px;
    text-align:right;
    margin-top:10px;
}

.response-box{
    background:#020617;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    border:1px solid #334155;
}

/* SEARCH */
.search-box{ margin:10px 0; }

.history-box{
    background:#1e293b;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
}
.history-box:hover{ background:#334155; }

.highlight{
    background:yellow;
    color:black;
    padding:2px;
    border-radius:3px;
}

/* FOOTER */
.sidebar-footer{
    border-top:1px solid #334155;
    padding-top:10px;
}

/* INPUT */
.input-area{
    padding:15px;
    border-top:1px solid #334155;
    background:#1e293b;
}

.file-menu{
    position:absolute;
    bottom:45px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:10px;
    display:none;
}
.file-menu button{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:white;
    padding:8px;
}

.mic-active{
    background:red !important;
}
</style>
</head>

<body>

<div id="mainIcon" class="main-icon">🤖</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

    <div class="d-flex justify-content-between">
        <h5>Chats</h5>
        <button class="btn btn-sm btn-outline-light" onclick="sidebar.classList.remove('open')">✖</button>
    </div>

    <div class="sidebar-content">

        <a href="/new_chat" class="btn btn-primary w-100 mt-2">+ New Chat</a>

        <input id="searchBox" class="form-control search-box" placeholder="Search messages...">

        <div id="searchResults"></div>

        <div id="chatHistory">
        {% for conv in conversations %}
            <div class="history-box">
                <a href="/chat/{{ conv[0] }}" style="color:white;text-decoration:none;">
                    {{ conv[1] }}
                </a>
            </div>
        {% endfor %}
        </div>

    </div>

    <div class="sidebar-footer">
        <a href="/logout" class="btn btn-outline-danger w-100">Logout</a>
    </div>

</div>

<!-- CHAT -->
<div class="chat-area">

<div id="chatBox" class="messages">
{% for msg in chat %}

    <div class="user-box message"
         id="msg-{{ msg.id }}"
         data-text="{{ msg.user | e }}">
        {{ msg.user }}
    </div>

    {% if msg.type == "text" %}
    <div class="response-box message"
         id="msg-{{ msg.id }}"
         data-text="{{ msg.bot | striptags | e }}">
        {{ msg.bot | safe }}
    </div>
    {% endif %}

    {% if msg.type == "image" %}
    <div class="response-box text-center"
         id="msg-{{ msg.id }}">
        <img src="{{ msg.image }}" style="max-width:100%;">
    </div>
    {% endif %}

{% endfor %}
</div>

<div class="input-area">
<form method="POST" action="/tool" enctype="multipart/form-data">
<div class="input-group">

<button type="button" onclick="toggleMenu()" class="btn btn-outline-light">➕</button>

<input type="file" id="fileInput" name="file" class="d-none">

<input class="form-control" id="chatInput" name="input" placeholder="Ask anything...">

<button type="button" id="micBtn" class="btn btn-outline-light">🎤</button>
<button class="btn btn-primary">Send</button>

</div>
</form>

<div id="fileMenu" class="file-menu">
<button onclick="openFile()">📄 Upload File</button>
<button onclick="openImage()">🖼 Upload Image</button>
</div>

</div>

</div>

<script>

// SIDEBAR
const sidebar=document.getElementById("sidebar");
document.getElementById("mainIcon").onclick=()=>sidebar.classList.add("open");

// SEARCH
searchBox.oninput=async ()=>{
    let q=searchBox.value.trim();

    if(q.length<2){
        searchResults.innerHTML="";
        chatHistory.style.display="block";
        return;
    }

    chatHistory.style.display="none";

    let res=await fetch(`/search?q=${encodeURIComponent(q)}`);
    let data=await res.json();

    let html="";

    data.results.forEach(r=>{
        let text=r.snippet.replace(new RegExp(`(${q})`,"gi"),
        `<span class="highlight">$1</span>`);

        html+=`
        <div class="history-box" onclick="openChat(${r.conv_id},${r.msg_id})">
            ${text}...
        </div>`;
    });

    searchResults.innerHTML=html;
};

function openChat(c,m){
    let q=encodeURIComponent(searchBox.value);
    location.href=`/chat/${c}?msg=${m}&q=${q}`;
}

// JUMP + HIGHLIGHT
window.onload=()=>{
    let p=new URLSearchParams(location.search);
    let msg=p.get("msg");
    let q=p.get("q");

    let box=document.getElementById("chatBox");

    if(msg){
        let el=document.getElementById("msg-"+msg);
        if(el){
            el.scrollIntoView({behavior:"smooth",block:"center"});

            highlight(el,q);

            el.style.border="2px solid yellow";
            setTimeout(()=>el.style.border="",3000);
        }
    }else{
        box.scrollTop=box.scrollHeight;
    }
};

function highlight(el,q){
    if(!q) return;

    let regex=new RegExp(`(${q})`,"gi");

    function walk(node){
        if(node.nodeType===3){
            if(regex.test(node.nodeValue)){
                let span=document.createElement("span");
                span.innerHTML=node.nodeValue.replace(regex,
                    `<span class="highlight">$1</span>`);
                node.replaceWith(span);
            }
        }else{
            node.childNodes.forEach(walk);
        }
    }

    walk(el);
}

// FILE
function toggleMenu(){
    fileMenu.style.display=fileMenu.style.display==="block"?"none":"block";
}
function openFile(){
    fileInput.accept=".pdf";
    fileInput.click();
}
function openImage(){
    fileInput.accept="image/*";
    fileInput.click();
}

// VOICE
let recognition,isListening=false;
micBtn.onclick=()=>{
    if(!('webkitSpeechRecognition' in window)) return alert("Not supported");

    if(isListening){
        recognition.stop();
        return;
    }

    recognition=new webkitSpeechRecognition();
    recognition.start();

    micBtn.classList.add("mic-active");
    isListening=true;

    recognition.onresult=e=>{
        chatInput.value=e.results[0][0].transcript;
    };

    recognition.onend=()=>{
        micBtn.classList.remove("mic-active");
        isListening=false;
    };
};

</script>

</body>
</html>

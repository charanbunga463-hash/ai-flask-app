<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional AI Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --sidebar-width: 300px;
            --transition-speed: 0.3s;
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --accent-blue: #2563eb;
            --border-ui: #334155;
        }

        body {
            background: var(--bg-body);
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-body);
            border-right: 1px solid var(--border-ui);
            height: 100%;
            position: fixed;
            left: calc(var(--sidebar-width) * -1);
            transition: left var(--transition-speed);
            display: flex;
            flex-direction: column;
            z-index: 1050;
            padding: 1rem;
        }
        .sidebar.open { left: 0; }

        /* --- MAIN WRAPPER --- */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: margin-left var(--transition-speed);
            position: relative;
        }
        body.sidebar-open .main-wrapper { margin-left: var(--sidebar-width); }

        /* --- STORIES --- */
        .stories-container {
            display: flex;
            gap: 15px;
            padding: 15px 15%;
            overflow-x: auto;
            background: #111827;
            border-bottom: 1px solid var(--border-ui);
        }
        .story-circle {
            min-width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            cursor: pointer;
            padding: 2px;
            overflow: hidden;
        }
        .story-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .add-story-btn {
            min-width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px dashed #64748b;
        }

        /* --- CHAT AREA --- */
        .chat-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15%;
        }
        .user-box {
            background: var(--accent-blue);
            padding: 12px 20px;
            border-radius: 15px 15px 0 15px;
            margin: 15px 0 15px auto;
            max-width: 80%;
            width: fit-content;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .response-box {
            background: #020617;
            padding: 20px;
            border-radius: 0 15px 15px 15px;
            margin: 15px 0;
            border: 1px solid var(--border-ui);
            max-width: 85%;
        }
        .response-box img { max-width: 100%; border-radius: 10px; margin-top: 10px; }

        /* --- INPUT --- */
        .input-container {
            padding: 20px 15%;
            background: var(--bg-body);
            border-top: 1px solid var(--border-ui);
        }
        .custom-input-group {
            background: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
        }
        .custom-input-group input {
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            flex: 1;
            outline: none;
        }

        .menu-trigger {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--bg-card);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1000;
            border: 1px solid var(--border-ui);
        }

        .history-item {
            padding: 10px;
            background: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
        }
        .history-item:hover { border-color: var(--accent-blue); }
        .icon-btn { background: none; border: none; color: #94a3b8; cursor: pointer; }
        
        .cursor {
            display: inline-block;
            width: 8px; height: 18px;
            background: var(--accent-blue);
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="menuTrigger" class="menu-trigger">☰ Menu</div>

<nav id="sidebar" class="sidebar">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="m-0">AI Chat History</h5>
        <button class="icon-btn" onclick="closeSidebar()">✕</button>
    </div>

    <a href="/new_chat" class="btn btn-primary w-100 mb-3">+ New Conversation</a>
    
    <input id="searchBox" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Search chats...">
    
    <div class="flex-grow-1 overflow-auto">
        <div id="searchResults"></div>
        <div id="chatHistory">
            {% for conv in conversations %}
                <div class="history-item">
                    <a href="/chat/{{ conv[0] }}" class="text-white text-decoration-none text-truncate flex-grow-1">
                        {{ conv[1] }}
                    </a>
                    <div class="d-flex gap-2">
                        <button class="icon-btn" onclick="enableRename('{{ conv[0] }}')">✏️</button>
                        <form method="POST" action="/delete_chat/{{ conv[0] }}" onsubmit="return confirm('Delete this chat?')">
                            <button class="icon-btn">🗑</button>
                        </form>
                    </div>
                </div>
                <form method="POST" action="/edit_chat/{{ conv[0] }}">
                    <input id="rename-{{ conv[0] }}" name="title" class="form-control form-control-sm mb-2" style="display:none;" placeholder="Enter to rename">
                </form>
            {% endfor %}
        </div>
    </div>

    <div class="pt-3 border-top border-secondary">
        <a href="/logout" class="btn btn-outline-danger w-100">Logout</a>
    </div>
</nav>

<div class="main-wrapper">
    <div class="stories-container" id="storyBar">
        <div class="add-story-btn" data-bs-toggle="modal" data-bs-target="#storyModal">+</div>
    </div>

    <div id="chatBox" class="chat-scroll-area">
        {% for msg in chat %}
            <div class="user-box">{{ msg.user }}</div>
            <div class="response-box">
                {% if msg.type == "text" %}
                    <div class="msg-content">{{ msg.bot | safe }}</div>
                {% elif msg.type == "image" %}
                    <img src="{{ msg.image }}" class="shadow">
                {% endif %}
            </div>
        {% endfor %}
        <div id="streamingContainer"></div>
    </div>

    <div class="input-container">
        <form id="chatForm" method="POST" action="/tool" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="file" style="display:none;" accept="image/*,application/pdf">
            <div class="custom-input-group shadow-lg">
                <button type="button" class="icon-btn" onclick="document.getElementById('fileInput').click()">➕</button>
                <input id="chatInput" name="input" placeholder="Type here or upload a PDF..." required autocomplete="off">
                <button type="button" id="micBtn" class="icon-btn me-2">🎤</button>
                <button type="submit" class="btn btn-primary px-4">Send</button>
            </div>
            <div id="fileStatus" class="mt-2 small text-info ms-5"></div>
        </form>
    </div>
</div>

<div class="modal fade" id="storyModal" tabindex="-1">
    <div class="modal-dialog">
        <form action="/add_story" method="POST" class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">New Story</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <textarea name="content" class="form-control bg-transparent text-white mb-3" placeholder="Tell your story..."></textarea>
                <input name="media_url" class="form-control bg-transparent text-white" placeholder="Image URL (optional)">
            </div>
            <div class="modal-footer border-secondary">
                <button type="submit" class="btn btn-primary w-100">Post</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const sidebar = document.getElementById("sidebar");
    const menuTrigger = document.getElementById("menuTrigger");
    const chatBox = document.getElementById("chatBox");
    const fileInput = document.getElementById("fileInput");

    // Sidebar Toggle
    menuTrigger.onclick = () => {
        sidebar.classList.add("open");
        document.body.classList.add("sidebar-open");
    };
    function closeSidebar() {
        sidebar.classList.remove("open");
        document.body.classList.remove("sidebar-open");
    }

    // File Upload Status
    fileInput.onchange = () => {
        if(fileInput.files[0]) document.getElementById("fileStatus").innerText = "📎 ready: " + fileInput.files[0].name;
    };

    // Auto Scroll
    const scrollToBottom = () => chatBox.scrollTop = chatBox.scrollHeight;
    window.onload = scrollToBottom;

    // Fetch Stories
    async function loadStories() {
        const res = await fetch('/stories');
        const data = await res.json();
        const bar = document.getElementById('storyBar');
        data.forEach(s => {
            const div = document.createElement('div');
            div.className = 'story-circle';
            div.innerHTML = `<img src="${s.media || 'https://ui-avatars.com/api/?name='+s.user}" title="${s.user}">`;
            div.onclick = () => {
                alert(`${s.user}: ${s.content}`);
                fetch(`/view_story/${s.id}`);
            };
            bar.appendChild(div);
        });
    }
    loadStories();

    // Streaming Handle
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('do_stream') === 'true') {
        const container = document.getElementById('streamingContainer');
        const rBox = document.createElement('div');
        rBox.className = 'response-box';
        rBox.innerHTML = '<div id="streamTarget"></div><span class="cursor"></span>';
        container.appendChild(rBox);
        scrollToBottom();

        const streamTarget = document.getElementById('streamTarget');
        const eventSource = new EventSource("/stream");
        let fullText = "";

        eventSource.onmessage = (e) => {
            if (e.data === "[DONE]") {
                eventSource.close();
                document.querySelector(".cursor").remove();
                // Refresh to finalize Markdown and clean URL
                setTimeout(() => location.href = location.pathname, 1000);
                return;
            }
            const data = JSON.parse(e.data);
            fullText += data.chunk;
            streamTarget.innerHTML = marked.parse(fullText); // Markdown parsing!
            scrollToBottom();
        };
        eventSource.onerror = () => eventSource.close();
    }

    // Voice to Text
    const micBtn = document.getElementById("micBtn");
    micBtn.onclick = () => {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return alert("Browser does not support Speech Recognition");
        
        const rec = new Speech();
        rec.start();
        micBtn.style.color = "red";
        rec.onresult = (e) => {
            document.getElementById("chatInput").value = e.results[0][0].transcript;
        };
        rec.onend = () => micBtn.style.color = "#94a3b8";
    };

    // Rename Logic
    function enableRename(id) {
        const input = document.getElementById("rename-" + id);
        input.style.display = input.style.display === "none" ? "block" : "none";
        input.focus();
    }
</script>

</body>
</html>

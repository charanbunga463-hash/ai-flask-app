<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Professional Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --sidebar-width: 300px;
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --accent-blue: #2563eb;
            --border-ui: #334155;
            --text-main: #f8fafc;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #0b1120;
            border-right: 1px solid var(--border-ui);
            height: 100%;
            position: fixed;
            left: calc(var(--sidebar-width) * -1);
            transition: 0.3s ease;
            z-index: 1050;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        .sidebar.open { left: 0; }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: 0.3s ease;
            position: relative;
        }
        body.sidebar-open .main-wrapper { margin-left: var(--sidebar-width); }

        /* --- STORIES --- */
        .stories-bar {
            display: flex;
            gap: 15px;
            padding: 15px 10%;
            background: #111827;
            border-bottom: 1px solid var(--border-ui);
            overflow-x: auto;
        }
        .story-item {
            min-width: 60px; height: 60px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            cursor: pointer;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-card);
        }
        .story-item img { width: 100%; height: 100%; object-fit: cover; }
        .add-story { border: 2px dashed #475569; font-size: 24px; color: #475569; }

        /* --- CHAT AREA --- */
        .chat-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 10%;
        }

        .user-box {
            background: var(--accent-blue);
            padding: 12px 20px;
            border-radius: 15px 15px 0 15px;
            margin: 15px 0 15px auto;
            max-width: 80%;
            width: fit-content;
        }

        .response-box {
            background: #020617;
            padding: 20px;
            border-radius: 0 15px 15px 15px;
            margin: 15px 0;
            border: 1px solid var(--border-ui);
            max-width: 90%;
            line-height: 1.6;
        }

        /* --- INPUT --- */
        .input-container {
            padding: 20px 10%;
            border-top: 1px solid var(--border-ui);
        }
        .custom-input-group {
            background: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
        }
        .custom-input-group input {
            background: transparent; border: none; color: white;
            flex: 1; padding: 12px; outline: none;
        }

        .menu-trigger {
            position: absolute; top: 15px; left: 15px;
            background: var(--bg-card); padding: 8px 15px;
            border-radius: 8px; cursor: pointer; z-index: 1000;
            border: 1px solid var(--border-ui);
        }

        /* --- HISTORY ITEMS --- */
        .history-item {
            background: var(--bg-card);
            padding: 10px; border-radius: 8px;
            margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .history-item a { 
            color: #cbd5e1; text-decoration: none; font-size: 0.9rem; 
            flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }

        .icon-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px; }
        .icon-btn:hover { color: white; }

        .cursor { display: inline-block; width: 8px; height: 18px; background: var(--accent-blue); animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="sidebar-open">

<div id="menuTrigger" class="menu-trigger">☰</div>

<nav id="sidebar" class="sidebar open">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="m-0">AI Dashboard</h5>
        <button class="icon-btn" onclick="closeSidebar()">✕</button>
    </div>

    <a href="/new_chat" class="btn btn-primary w-100 mb-3">+ New Chat</a>
    
    <input id="searchBox" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Search..." onkeyup="searchChats()">
    
    <div class="flex-grow-1 overflow-auto" id="historyList">
        {% for conv in conversations %}
        <div class="history-item" id="conv-{{ conv[0] }}">
            <a href="/chat/{{ conv[0] }}">{{ conv[1] }}</a>
            <div class="d-flex gap-1">
                <button class="icon-btn" onclick="renameChat('{{ conv[0] }}')">✏️</button>
                <button class="icon-btn" onclick="deleteHistory('{{ conv[0] }}')">🗑</button>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="mt-auto pt-3 border-top border-secondary">
        <a href="/logout" class="btn btn-sm btn-outline-danger w-100">Logout</a>
    </div>
</nav>

<div class="main-wrapper">
    <div class="stories-bar" id="storiesBar">
        <div class="story-item add-story" onclick="document.getElementById('storyInputBtn').click()">+</div>
    </div>

    <div id="chatBox" class="chat-scroll-area">
        {% for msg in chat %}
            <div class="user-box">{{ msg.user }}</div>
            <div class="response-box">
                {% if msg.type == "text" %}
                    <div class="markdown-body">{{ msg.bot | safe }}</div>
                {% else %}
                    <img src="{{ msg.image }}" class="img-fluid rounded">
                {% endif %}
            </div>
        {% endfor %}
        <div id="streamingZone"></div>
    </div>

    <div class="input-container">
        <form id="chatForm" method="POST" action="/tool" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="file" style="display:none;" accept=".pdf,image/*">
            <div class="custom-input-group shadow">
                <button type="button" class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input id="chatInput" name="input" placeholder="Ask a question or upload a PDF..." required autocomplete="off">
                <button type="button" id="micBtn" class="icon-btn me-2">🎤</button>
                <button type="submit" class="btn btn-primary px-4">Send</button>
            </div>
            <div id="fileStatus" class="mt-2 small text-info ms-5"></div>
        </form>
    </div>
</div>

<button id="storyInputBtn" style="display:none" data-bs-toggle="modal" data-bs-target="#storyModal"></button>
<div class="modal fade" id="storyModal" tabindex="-1">
    <div class="modal-dialog">
        <form action="/add_story" method="POST" class="modal-content bg-dark text-white border-secondary">
            <div class="modal-body">
                <textarea name="content" class="form-control bg-transparent text-white mb-2" placeholder="What's happening?"></textarea>
                <input name="media_url" class="form-control bg-transparent text-white" placeholder="Image URL (optional)">
            </div>
            <div class="modal-footer border-0">
                <button type="submit" class="btn btn-primary">Post Story</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const sidebar = document.getElementById("sidebar");
    const chatBox = document.getElementById("chatBox");
    const fileInput = document.getElementById("fileInput");

    // --- Sidebar Toggle ---
    document.getElementById("menuTrigger").onclick = () => {
        sidebar.classList.toggle("open");
        document.body.classList.toggle("sidebar-open");
    };
    function closeSidebar() {
        sidebar.classList.remove("open");
        document.body.classList.remove("sidebar-open");
    }

    // --- Search ---
    function searchChats() {
        let filter = document.getElementById('searchBox').value.toLowerCase();
        document.querySelectorAll('.history-item').forEach(item => {
            let text = item.querySelector('a').innerText.toLowerCase();
            item.style.display = text.includes(filter) ? "" : "none";
        });
    }

    // --- Rename ---
    function renameChat(id) {
        const title = prompt("New title:");
        if (title) {
            const f = document.createElement('form');
            f.method = 'POST'; f.action = `/edit_chat/${id}`;
            const i = document.createElement('input');
            i.name = 'title'; i.value = title;
            f.appendChild(i); document.body.appendChild(f); f.submit();
        }
    }

    // --- Instant Delete (No Page Reload) ---
    async function deleteHistory(id) {
        if (!confirm("Delete chat?")) return;
        const res = await fetch(`/delete_chat/${id}`, { method: 'POST' });
        if (res.ok) {
            document.getElementById(`conv-${id}`).remove();
            if (window.location.pathname.includes(`/chat/${id}`)) window.location.href = "/";
        }
    }

    // --- Load Stories ---
    async function loadStories() {
        const res = await fetch('/stories');
        const data = await res.json();
        const bar = document.getElementById('storiesBar');
        data.forEach(s => {
            const d = document.createElement('div');
            d.className = 'story-item';
            d.innerHTML = `<img src="${s.media || 'https://ui-avatars.com/api/?name='+s.user}">`;
            d.onclick = () => alert(s.user + ": " + s.content);
            bar.appendChild(d);
        });
    }
    loadStories();

    // --- Voice ---
    const micBtn = document.getElementById("micBtn");
    micBtn.onclick = () => {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Rec) return;
        const speech = new Rec();
        speech.start();
        micBtn.style.color = "red";
        speech.onresult = (e) => document.getElementById("chatInput").value = e.results[0][0].transcript;
        speech.onend = () => micBtn.style.color = "#94a3b8";
    };

    // --- Streaming logic for PDF/Large Text ---
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('do_stream') === 'true') {
        const zone = document.getElementById('streamingZone');
        const botDiv = document.createElement('div');
        botDiv.className = 'response-box';
        botDiv.innerHTML = '<div id="streamTarget"></div><span class="cursor"></span>';
        zone.appendChild(botDiv);

        const target = document.getElementById('streamTarget');
        const eventSource = new EventSource("/stream");
        let full = "";

        eventSource.onmessage = (e) => {
            if (e.data === "[DONE]") {
                eventSource.close();
                setTimeout(() => location.href = location.pathname, 800);
                return;
            }
            const data = JSON.parse(e.data);
            full += data.chunk;
            target.innerHTML = marked.parse(full);
            chatBox.scrollTop = chatBox.scrollHeight;
        };
    }

    fileInput.onchange = () => { if(fileInput.files[0]) document.getElementById("fileStatus").innerText = "📎 " + fileInput.files[0].name; };
    window.onload = () => chatBox.scrollTop = chatBox.scrollHeight;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
}

.chat-container {
    max-width: 800px;
    margin: auto;
    margin-top: 40px;
}

.card {
    background-color: #1e293b;
    border: none;
    border-radius: 15px;
}

.input-box {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: white;
}

.input-box::placeholder {
    color: #94a3b8;
}

.btn-ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
}

.btn-ai:hover {
    opacity: 0.9;
}

.response-box {
    background-color: #020617;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
    border: 1px solid #ffffff;
    color: #ffffff;
    white-space: pre-wrap;
}

.image-box {
    margin-top: 20px;
    text-align: center;
}

.image-box img {
    max-width: 100%;
    border-radius: 12px;
    border: 2px solid #334155;
    margin-top: 10px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.small-text {
    color: #ffffff;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="chat-container">

  <div class="card p-4">

    <!-- Header -->
    <div class="header mb-3">
      <div>
        <h4 style="color:#ffffff;">🤖 AI Assistant</h4>
        <span class="small-text">Welcome {{user}}</span>
      </div>
      <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
    </div>

    <!-- Usage -->
    <p class="small-text">Usage today: {{count}}</p>

    <!-- Form -->
    <form method="POST" action="/tool">
      <div class="input-group">
        <input 
          class="form-control input-box" 
          name="input" 
          placeholder="Ask anything or 'generate image of...' "
          required
        >
        <button class="btn btn-ai text-white">Send</button>
      </div>
    </form>

    <!-- TEXT OUTPUT -->
    {% if output %}
      <div class="response-box">
        {{ output | safe }}
      </div>
    {% endif %}

    <!-- IMAGE OUTPUT -->
    {% if image %}
      <div class="image-box">
        <h5>🖼 Generated Image</h5>
        <img src="{{ image }}" alt="Generated Image">
      </div>
    {% endif %}

  </div>

</div>

</body>
</html>

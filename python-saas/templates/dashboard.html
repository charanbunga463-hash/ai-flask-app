<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional AI Interface</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --sidebar-width: 300px;
    --transition-speed: 0.3s;
    --bg-body: #0f172a;
    --bg-card: #1e293b;
    --accent-blue: #2563eb;
    --border-ui: #334155;
}

body {
    background: var(--bg-body);
    color: #f8fafc;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* SIDEBAR */
.sidebar {
    width: var(--sidebar-width);
    background: var(--bg-body);
    border-right: 1px solid var(--border-ui);
    height: 100%;
    position: fixed;
    left: calc(var(--sidebar-width) * -1);
    transition: left var(--transition-speed);
    display: flex;
    flex-direction: column;
    z-index: 1050;
    padding: 1rem;
}
.sidebar.open { left: 0; }

/* MAIN */
.main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin-left: 0;
    transition: margin-left var(--transition-speed);
    position: relative;
}
body.sidebar-open .main-wrapper { margin-left: var(--sidebar-width); }

/* MENU */
.menu-trigger {
    position: absolute;
    top: 15px;
    left: 15px;
    background: var(--bg-card);
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
    z-index: 1000;
    border: 1px solid var(--border-ui);
}
.menu-trigger:hover { background: var(--border-ui); }

/* STORIES BAR */
#storiesBar {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding: 10px 15%;
    border-bottom: 1px solid var(--border-ui);
}

/* CHAT */
.chat-scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 15%;
}

/* MESSAGES */
.user-box {
    background: var(--accent-blue);
    padding: 12px 20px;
    border-radius: 15px 15px 0 15px;
    margin: 15px 0 15px auto;
    max-width: 80%;
}

.response-box {
    background: #020617;
    padding: 20px;
    border-radius: 0 15px 15px 15px;
    margin: 15px 0;
    border: 1px solid var(--border-ui);
    max-width: 85%;
}

/* INPUT */
.input-container {
    padding: 20px 15%;
    border-top: 1px solid var(--border-ui);
}

.custom-input-group {
    background: var(--bg-card);
    border: 1px solid var(--border-ui);
    border-radius: 12px;
    display: flex;
    align-items: center;
    padding: 5px 15px;
}

.custom-input-group input {
    background: transparent;
    border: none;
    color: white;
    flex: 1;
}

/* STORY VIEWER */
#storyViewer {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:black;
    z-index:2000;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#progressBar {
    position:absolute;
    top:0;
    left:0;
    height:4px;
    background:#2563eb;
    width:0%;
}

/* CURSOR */
.cursor {
    display:inline-block;
    width:8px;
    height:18px;
    background:var(--accent-blue);
    animation:blink 0.8s infinite;
}
@keyframes blink {50%{opacity:0;}}
</style>
</head>

<body>

<div id="menuTrigger" class="menu-trigger">🤖 Menu</div>

<!-- SIDEBAR (UNCHANGED) -->
<nav id="sidebar" class="sidebar">
    <h5>History</h5>
    <a href="/new_chat" class="btn btn-primary w-100 mb-3">+ New</a>
    <input id="searchBox" class="form-control mb-3 bg-dark text-white" placeholder="Search">
    <div id="searchResults"></div>
    <div id="chatHistory">
        {% for conv in conversations %}
        <div class="history-item">
            <a href="/chat/{{ conv[0] }}">{{ conv[1] }}</a>
        </div>
        {% endfor %}
    </div>
    <a href="/logout" class="btn btn-outline-danger">Logout</a>
</nav>

<div class="main-wrapper">

<!-- STORIES -->
<div id="storiesBar">
    <div id="storiesContainer" style="display:flex; gap:15px;"></div>
</div>

<!-- CHAT -->
<div id="chatBox" class="chat-scroll-area">
    {% for msg in chat %}
    <div class="user-box">{{ msg.user }}</div>
    <div class="response-box">
        {% if msg.type == "text" %}
            {{ msg.bot | safe }}
        {% else %}
            <img src="{{ msg.image }}" class="img-fluid">
        {% endif %}
    </div>
    {% endfor %}
    <div id="streamingContainer"></div>
</div>

<!-- INPUT -->
<div class="input-container">
<form method="POST" action="/tool" enctype="multipart/form-data">
<div class="custom-input-group">
<input name="input" placeholder="Ask...">
<button class="btn btn-primary">Send</button>
</div>
</form>
</div>

</div>

<!-- STORY VIEWER -->
<div id="storyViewer">
    <div id="progressBar"></div>
    <div id="storyContent"></div>
    <button onclick="closeStory()">✖</button>
</div>

<script>

/* SIDEBAR */
menuTrigger.onclick=()=>{sidebar.classList.add("open");document.body.classList.add("sidebar-open");}

/* STORIES */
let stories=[],i=0,timer;

async function loadStories(){
 let res=await fetch("/stories");
 stories=await res.json();
 let c=document.getElementById("storiesContainer");
 c.innerHTML="";
 stories.forEach((s,idx)=>{
  c.innerHTML+=`<div onclick="openStory(${idx})">
  <div style="width:60px;height:60px;border-radius:50%;border:3px solid #2563eb;display:flex;align-items:center;justify-content:center;">
  ${s.user[0]}
  </div></div>`;
 });
}

function openStory(idx){
 i=idx;
 storyViewer.style.display="flex";
 showStory();
}

function showStory(){
 let s=stories[i];
 storyContent.innerHTML=`<p>${s.content}</p>`;
 progressBar.style.width="0%";
 setTimeout(()=>{progressBar.style.width="100%";},50);
 timer=setTimeout(nextStory,5000);
 fetch(`/view_story/${s.id}`,{method:"POST"});
}

function nextStory(){
 i++;
 if(i>=stories.length){closeStory();return;}
 showStory();
}

function closeStory(){
 storyViewer.style.display="none";
 clearTimeout(timer);
}

window.onload=loadStories;

</script>

</body>
</html>

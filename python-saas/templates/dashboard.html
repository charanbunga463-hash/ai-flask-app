<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
}

/* Layout */
.main-container {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 300px;
    background-color: #0f172a;
    border-right: 1px solid #334155;
    overflow-y: auto;
    padding: 15px;

    position: fixed;
    left: -300px;
    top: 0;
    height: 100%;
    transition: 0.3s;
    z-index: 1000;
}
.sidebar.open { left: 0; }

.history-box {
    background-color: #1e293b;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
}
.history-box.active { background-color: #334155; }

.history-box a {
    color: white;
    text-decoration: none;
    flex: 1;
    font-size: 14px;
}

/* CHAT AREA */
.chat-area {
    width: 100%;
    display: flex;
    flex-direction: column;
}

/* Header */
.top-bar {
    padding: 10px 15px;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Messages */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* Input */
.input-area {
    padding: 15px;
    border-top: 1px solid #334155;
    background-color: #1e293b;
}

/* Chat bubbles */
.user-box {
    background-color: #1e40af;
    padding: 10px;
    border-radius: 10px;
    text-align: right;
    margin-top: 10px;
}

.response-box {
    background-color: #020617;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    border: 1px solid #334155;
    white-space: pre-wrap;
}

/* Inputs */
.input-box {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: white;
}

.btn-ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}
</style>
</head>

<body>

<div class="main-container">

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">
        <h5>🕘 Chats</h5>
        <a href="/new_chat" class="btn btn-sm btn-primary w-100 mb-3">+ New Chat</a>

        {% for conv in conversations %}
        <div class="history-box {% if conv[0] == active_chat %}active{% endif %}">
            <a href="/chat/{{ conv[0] }}">{{ conv[1] }}</a>

            <div class="dropdown">
                <button class="btn btn-sm text-white" data-bs-toggle="dropdown">⋯</button>
                <ul class="dropdown-menu dropdown-menu-dark">

                    <li>
                        <button class="dropdown-item"
                                onclick="editChat('{{ conv[0] }}','{{ conv[1] }}')">
                            Rename
                        </button>
                    </li>

                    <li>
                        <form method="POST" action="/delete_chat/{{ conv[0] }}">
                            <button class="dropdown-item text-danger">
                                Delete
                            </button>
                        </form>
                    </li>

                </ul>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area">

        <!-- TOP BAR -->
        <div class="top-bar">
            <h5>🤖 AI Assistant</h5>
            <div>
                <button class="btn btn-sm btn-outline-info" onclick="toggleSidebar()">📜 History</button>
                <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
            </div>
        </div>

        <!-- MESSAGES -->
        <div class="messages" id="chatBox">

            {% for msg in chat %}

            <div class="user-box">
                {{ msg.user }}
            </div>

            {% if msg.type == "text" %}
            <div class="response-box typing" data-text="{{ msg.bot | e }}"></div>
            {% endif %}

            {% if msg.type == "image" %}
            <div class="response-box text-center">
                <img src="{{ msg.image }}" style="max-width:100%; border-radius:10px;">
            </div>
            {% endif %}

            {% endfor %}

        </div>

        <!-- INPUT -->
        <div class="input-area">
            <form method="POST" action="/tool">
                <div class="input-group">
                    <input class="form-control input-box"
                           name="input"
                           placeholder="Ask anything..."
                           required>
                    <button class="btn btn-ai text-white">Send</button>
                </div>
            </form>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// Sidebar toggle
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
}

// Scroll bottom
const chatBox = document.getElementById("chatBox");
window.onload = () => {
    chatBox.scrollTop = chatBox.scrollHeight;
    startTyping();
};

// Typing effect
function typeText(element, text, speed = 15) {
    let i = 0;
    function typing() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

function startTyping() {
    const elements = document.querySelectorAll(".typing");

    elements.forEach((el, index) => {
        const text = el.getAttribute("data-text");
        el.innerHTML = "";

        // delay per message
        setTimeout(() => {
            typeText(el, text);
        }, index * 300);
    });
}

// Rename chat
function editChat(id, oldTitle) {
    let newTitle = prompt("Edit chat name:", oldTitle);

    if (newTitle && newTitle.trim() !== "") {
        let form = document.createElement("form");
        form.method = "POST";
        form.action = "/edit_chat/" + id;

        let input = document.createElement("input");
        input.type = "hidden";
        input.name = "title";
        input.value = newTitle;

        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
    }
}

</script>

</body>
</html>

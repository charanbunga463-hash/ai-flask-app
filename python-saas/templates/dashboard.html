<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
}

/* FIXED POSITIONS */
.ai-title {
    position: fixed;
    top: 15px;
    left: 20px;
    font-weight: bold;
    z-index: 1000;
}

.logout-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
}

/* Center mode */
.center-mode {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Chat mode */
.chat-container {
    max-width: 800px;
    margin: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ✅ Hide scrollbar but keep scroll */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    scroll-behavior: smooth;

    scrollbar-width: none;       /* Firefox */
}

.messages::-webkit-scrollbar {
    display: none;               /* Chrome, Safari */
}

.input-area {
    padding: 15px;
    border-top: 1px solid #334155;
    background-color: #1e293b;
}

.card {
    background-color: #1e293b;
    border-radius: 15px;
}

.input-box {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: white;
}

.btn-ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

.response-box {
    background-color: #020617;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
    border: 1px solid #ffffff;
}

/* User message */
.user-box {
    background-color: #1e40af;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    text-align: right;
}

/* Markdown styling */
.response-box ul {
    padding-left: 20px;
}

.response-box li {
    margin-bottom: 6px;
}

.small-text {
    font-size: 14px;
    color: #fff;
}
</style>
</head>

<body>

<!-- FIXED ELEMENTS -->
<div class="ai-title">
    <h5>🤖 AI Assistant</h5>
</div>

<a href="/logout" class="btn btn-sm btn-outline-danger logout-btn">Logout</a>

{% if chat|length == 0 %}
<!-- 🔵 CENTER MODE -->
<div class="center-mode">

  <div class="card p-4" style="width:100%; max-width:600px;">
    
    <div class="text-center mb-3">
      <p class="small-text">Welcome {{user}}</p>
    </div>

    <form method="POST" action="/tool">
      <div class="input-group">
        <input class="form-control input-box" name="input" placeholder="Ask anything..." required>
        <button class="btn btn-ai text-white">Send</button>
      </div>
    </form>

  </div>

</div>

{% else %}
<!-- 🟢 CHAT MODE -->
<div class="chat-container">

  <!-- Messages -->
  <div class="messages" id="chatBox">

    {% for msg in chat %}

      <div class="user-box">
        {{ msg.user }}
      </div>

      {% if msg.type == "text" %}
      <div class="response-box">
        {{ msg.bot | safe }}
      </div>
      {% endif %}

      {% if msg.type == "image" %}
      <div class="response-box text-center">
        <img src="{{ msg.image }}" style="max-width:100%; border-radius:10px;">
      </div>
      {% endif %}

    {% endfor %}

  </div>

  <!-- Input -->
  <div class="input-area">
    <form method="POST" action="/tool">
      <div class="input-group">
        <input class="form-control input-box" name="input" placeholder="Ask anything..." required>
        <button class="btn btn-ai text-white">Send</button>
      </div>
    </form>
  </div>

</div>
{% endif %}

<!-- ✅ AUTO SCROLL (kept) -->
<script>
window.onload = function() {
    const chatBox = document.getElementById("chatBox");
    if (chatBox) {
        chatBox.scrollTop = chatBox.scrollHeight;
    }
};
</script>

</body>
</html>

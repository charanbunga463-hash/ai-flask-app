<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
}

/* Layout */
.main-container {
    display: flex;
    height: 100vh;
}

/* LEFT PANEL */
.sidebar {
    width: 30%;
    border-right: 1px solid #334155;
    overflow-y: auto;
    padding: 15px;
}

.history-box {
    background-color: #1e293b;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}

.history-box.active {
    background-color: #334155;
}

/* RIGHT PANEL */
.chat-area {
    width: 70%;
    display: flex;
    flex-direction: column;
}

/* Header */
.top-bar {
    padding: 10px 15px;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Messages */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* Input */
.input-area {
    padding: 15px;
    border-top: 1px solid #334155;
    background-color: #1e293b;
}

/* Chat styles */
.user-box {
    background-color: #1e40af;
    padding: 10px;
    border-radius: 10px;
    text-align: right;
    margin-top: 10px;
}

.response-box {
    background-color: #020617;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    border: 1px solid #ffffff;
}

.input-box {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: white;
}

.btn-ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}
</style>
</head>

<body>

<div class="main-container">

    <!-- LEFT SIDE (CONVERSATIONS) -->
    <div class="sidebar">

        <a href="/new_chat" class="btn btn-sm btn-primary w-100 mb-3">+ New Chat</a>

        {% for conv in conversations %}
        <div class="history-box {% if conv[0] == active_chat %}active{% endif %}">

            <!-- CLICK CHAT -->
            <a href="/chat/{{ conv[0] }}" style="text-decoration:none; color:white; flex:1;">
                {{ conv[1] }}
            </a>

            <!-- ⋯ MENU -->
            <div class="dropdown">
                <button class="btn btn-sm text-white" data-bs-toggle="dropdown">⋯</button>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li>
                        <form method="POST" action="/delete_chat/{{ conv[0] }}" onsubmit="return confirmDeleteChat();">
                            <button class="dropdown-item text-danger">Delete</button>
                        </form>
                    </li>
                </ul>
            </div>

        </div>
        {% endfor %}

    </div>

    <!-- RIGHT SIDE -->
    <div class="chat-area">

        <!-- Top -->
        <div class="top-bar">
            <h5>🤖 AI Assistant</h5>
            <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
        </div>

        <!-- Messages -->
        <div class="messages" id="chatBox">

            {% for msg in chat %}

            <div class="user-box">
                {{ msg.user }}
            </div>

            {% if msg.type == "text" %}
            <div class="response-box">
                {{ msg.bot | safe }}
            </div>
            {% endif %}

            {% if msg.type == "image" %}
            <div class="response-box text-center">
                <img src="{{ msg.image }}" style="max-width:100%; border-radius:10px;">
            </div>
            {% endif %}

            {% endfor %}

        </div>

        <!-- Input -->
        <div class="input-area">
            <form method="POST" action="/tool">
                <div class="input-group">
                    <input class="form-control input-box" name="input" placeholder="Ask anything..." required>
                    <button class="btn btn-ai text-white">Send</button>
                </div>
            </form>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Scroll -->
<script>
const chatBox = document.getElementById("chatBox");

if (chatBox) {
    window.onload = function() {
        chatBox.scrollTop = chatBox.scrollHeight;
    };
}

function confirmDeleteChat() {
    return confirm("Delete this chat?");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusAI — New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--void:#020408;--surface:#0c1018;--raised:#111620;--border:rgba(255,255,255,0.06);
  --text:#ddeeff;--soft:#5a7a9a;--muted:#1e2d42;
  --gold:#f59e0b;--gglow:rgba(245,158,11,0.25);--red:#f87171;}
html,body{min-height:100vh;background:var(--void);color:var(--text);font-family:'Outfit',sans-serif;display:grid;place-items:center;padding:20px;}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 500px 400px at 50% 40%,rgba(245,158,11,0.06),transparent);}
.wrap{position:relative;z-index:1;width:100%;max-width:400px;}
.logo{text-align:center;margin-bottom:28px;}
.logo-icon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 0 28px var(--gglow);margin-bottom:12px;}
.logo-icon svg{width:26px;height:26px;color:#fff;}
.logo-name{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(12,16,24,0.9);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:22px;padding:34px 30px;box-shadow:0 40px 80px rgba(0,0,0,0.5);}
.card-icon{font-size:36px;margin-bottom:14px;}
.card-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:800;margin-bottom:6px;}
.card-sub{font-size:0.82rem;color:var(--soft);margin-bottom:24px;line-height:1.6;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.61rem;font-weight:700;text-transform:uppercase;letter-spacing:0.13em;color:var(--soft);margin-bottom:5px;}
.field-wrap{position:relative;}
.field-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);}
.field input{width:100%;background:var(--raised);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:0.83rem;padding:11px 14px 11px 37px;outline:none;transition:border-color 0.2s;}
.field input:focus{border-color:rgba(245,158,11,0.5);box-shadow:0 0 0 3px rgba(245,158,11,0.07);}
.err{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.25);border-radius:9px;padding:10px 14px;font-size:0.79rem;color:var(--red);margin-bottom:14px;}
.strength{margin-top:5px;height:3px;background:var(--raised);border-radius:2px;}
.strength-bar{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;width:0%;}
.btn{width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#0a0500;font-family:'Outfit',sans-serif;font-weight:700;font-size:0.92rem;padding:13px;border-radius:11px;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 20px var(--gglow);}
.btn:hover{opacity:0.88;transform:translateY(-1px);}
.btn-ghost{width:100%;margin-top:10px;padding:11px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--soft);font-family:'Outfit',sans-serif;font-weight:600;font-size:0.86rem;cursor:pointer;text-align:center;text-decoration:none;display:block;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 3L28 9V23L16 29L4 23V9L16 3Z" stroke="white" stroke-width="1.5" fill="rgba(255,255,255,0.1)"/><circle cx="16" cy="16" r="3" fill="white"/></svg>
    </div>
    <div class="logo-name">NexusAI</div>
  </div>
  <div class="card">
    {% if expired %}
    <div class="card-icon">⏰</div>
    <div class="card-title">Link expired</div>
    <div class="card-sub">This reset link has expired or already been used. Please request a new one.</div>
    <a href="/forgot-password" class="btn" style="display:block;text-align:center;text-decoration:none;">Request New Link →</a>
    {% else %}
    <div class="card-icon">🔒</div>
    <div class="card-title">Create new password</div>
    <div class="card-sub">Choose a strong password for your NexusAI account.</div>
    {% if error %}<div class="err">⚠ {{ error }}</div>{% endif %}
    <form method="POST" action="/reset-password/{{ token }}">
      <div class="field">
        <label>New Password</label>
        <div class="field-wrap">
          <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" name="password" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password" oninput="updateStrength(this.value)" id="pwd">
        </div>
        <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <div class="field-wrap">
          <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" name="password_confirm" placeholder="Repeat password" required autocomplete="new-password" id="pwd2">
        </div>
      </div>
      <button type="submit" class="btn" onclick="return checkMatch()">Set New Password →</button>
    </form>
    <a href="/login" class="btn-ghost">← Back to Sign In</a>
    {% endif %}
  </div>
</div>
<script>
function updateStrength(pwd){
  const bar=document.getElementById('strengthBar');
  let score=0;
  if(pwd.length>=6)score++;if(pwd.length>=10)score++;
  if(/[A-Z]/.test(pwd))score++;if(/[0-9]/.test(pwd))score++;if(/[^A-Za-z0-9]/.test(pwd))score++;
  const colors=['#f87171','#fb923c','#facc15','#4ade80','#34d399'];
  const widths=['20%','40%','60%','80%','100%'];
  bar.style.width=widths[score-1]||'0%';bar.style.background=colors[score-1]||'transparent';
}
function checkMatch(){
  const p1=document.getElementById('pwd').value;
  const p2=document.getElementById('pwd2').value;
  if(p1!==p2){alert('Passwords do not match');return false;}
  return true;
}
</script>
</body>
</html>

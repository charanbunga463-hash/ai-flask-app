<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
}

/* Layout */
.chat-container {
    max-width: 800px;
    margin: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Messages area */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* Fixed input at bottom */
.input-area {
    padding: 15px;
    border-top: 1px solid #334155;
    background-color: #1e293b;
}

/* UI styles */
.card {
    background-color: #1e293b;
    border: none;
    border-radius: 15px;
}

.input-box {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: white;
}

.input-box::placeholder {
    color: #94a3b8;
}

.btn-ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
}

.response-box {
    background-color: #020617;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
    border: 1px solid #ffffff;
    color: #ffffff;
    white-space: pre-wrap;
}

.image-box img {
    max-width: 100%;
    border-radius: 12px;
    border: 2px solid #334155;
    margin-top: 10px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.small-text {
    color: #ffffff;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="chat-container">

  <!-- Header -->
  <div class="p-3">
    <div class="header">
      <div>
        <h4>🤖 AI Assistant</h4>
        <span class="small-text">Welcome {{user}}</span>
      </div>
      <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
    </div>
    <p class="small-text mt-2">Usage today: {{count}}</p>
  </div>

  <!-- Messages -->
  <div class="messages">

    {% if output %}
      <div class="response-box">
        {{ output | safe }}
      </div>
    {% endif %}

    {% if image %}
      <div class="response-box text-center">
        <h5>🖼 Generated Image</h5>
        <div class="image-box">
          <img src="{{ image }}">
        </div>
      </div>
    {% endif %}

  </div>

  <!-- Input (fixed bottom) -->
  <div class="input-area">
    <form method="POST" action="/tool">
      <div class="input-group">
        <input 
          class="form-control input-box" 
          name="input" 
          placeholder="Ask anything..."
          required
        >
        <button class="btn btn-ai text-white">Send</button>
      </div>
    </form>
  </div>

</div>

</body>
</html>

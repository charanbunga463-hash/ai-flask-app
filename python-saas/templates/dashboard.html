<!DOCTYPE html>
<html>
<head>
<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background:#0f172a;
    color:white;
}

.messages {
    height:80vh;
    overflow:auto;
    padding:20px;
}

.user-box {
    background:#1e40af;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    text-align:right;
}

.bot-box {
    background:#020617;
    padding:10px;
    margin:10px 0;
    border-radius:10px;

    /* 🔥 IMPORTANT */
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="messages" id="chatBox"></div>

<form onsubmit="sendMessage(event)" class="p-3">
<input id="input" class="form-control" placeholder="Ask anything">
</form>

<script>

const chatBox = document.getElementById("chatBox");

function sendMessage(e){
    e.preventDefault();

    let input = document.getElementById("input");
    let text = input.value;
    input.value = "";

    // user
    let userDiv = document.createElement("div");
    userDiv.className="user-box";
    userDiv.textContent = text;
    chatBox.appendChild(userDiv);

    // bot
    let botDiv = document.createElement("div");
    botDiv.className="bot-box";
    chatBox.appendChild(botDiv);

    let es = new EventSource("/stream?input="+encodeURIComponent(text));

    es.onmessage = function(e){
        if(e.data === "[DONE]"){
            es.close();
            return;
        }

        // ✅ RAW OUTPUT (NO FORMAT)
        botDiv.textContent += e.data;
        chatBox.scrollTop = chatBox.scrollHeight;
    };
}

</script>

</body>
</html>

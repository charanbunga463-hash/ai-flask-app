<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraAI — Sign In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04060d;--surface:#0a0d18;--raised:#111827;--border:rgba(255,255,255,0.07);
  --text:#e2eaf8;--muted:#2e3d52;--soft:#6d839e;
  --teal:#00e5b5;--tglow:rgba(0,229,181,0.2);
  --violet:#8b5cf6;--vglow:rgba(139,92,246,0.2);
  --red:#f87171;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 700px 500px at 15% 85%,rgba(0,229,181,0.04),transparent),
    radial-gradient(ellipse 600px 400px at 85% 15%,rgba(139,92,246,0.05),transparent),
    radial-gradient(ellipse 400px 300px at 50% 50%,rgba(0,229,181,0.02),transparent);
}
/* Animated grid bg */
body::after{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(0,229,181,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,181,0.03) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black,transparent);
}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;}
.logo-banner{text-align:center;margin-bottom:28px;}
.logo-glyph{
  display:inline-flex;align-items:center;justify-content:center;
  width:56px;height:56px;background:linear-gradient(135deg,var(--teal),#00b38e);
  border-radius:14px;font-family:'Syne',sans-serif;font-weight:800;font-size:22px;
  color:var(--bg);box-shadow:0 0 32px var(--tglow),inset 0 1px 0 rgba(255,255,255,0.2);
  margin-bottom:14px;
}
.logo-name{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;
  letter-spacing:-0.05em;color:var(--text);}
.logo-name span{color:var(--teal);}
.logo-tag{font-size:0.82rem;color:var(--soft);margin-top:3px;}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:36px 32px 28px;
  box-shadow:0 32px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(0,229,181,0.05);
}
.card-title{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;
  margin-bottom:22px;letter-spacing:-0.03em;}
.card-title span{color:var(--teal);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.64rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.12em;color:var(--muted);margin-bottom:6px;}
.field input{
  width:100%;background:var(--raised);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;
  font-size:0.84rem;padding:11px 14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;
}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,229,181,0.08);}
.field input::placeholder{color:var(--muted);}
.show-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;
  font-size:0.78rem;color:var(--soft);cursor:pointer;}
.show-row input{width:14px;height:14px;accent-color:var(--teal);cursor:pointer;}
.err{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.25);
  border-radius:9px;padding:10px 14px;font-size:0.8rem;color:var(--red);
  margin-bottom:16px;text-align:center;}
.btn{
  width:100%;background:linear-gradient(135deg,var(--teal),#00b38e);
  border:none;color:var(--bg);font-family:'Syne',sans-serif;font-weight:800;
  font-size:0.92rem;padding:13px;border-radius:11px;cursor:pointer;
  letter-spacing:-0.01em;transition:opacity 0.2s,transform 0.2s;
  box-shadow:0 4px 20px var(--tglow);
}
.btn:hover{opacity:0.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0 0;
  color:var(--muted);font-size:0.74rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.foot{text-align:center;margin-top:14px;font-size:0.8rem;color:var(--soft);}
.foot a{color:var(--teal);text-decoration:none;font-weight:600;}
.foot a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-banner">
    <div class="logo-glyph">A</div>
    <div class="logo-name">Aura<span>AI</span></div>
    <div class="logo-tag">Your free AI workspace</div>
  </div>
  <div class="card">
    <div class="card-title">Sign in to <span>AuraAI</span></div>
    <form method="POST">
      <div class="field">
        <label>Username</label>
        <input name="username" placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="pwd" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <label class="show-row">
        <input type="checkbox" onchange="document.getElementById('pwd').type=this.checked?'text':'password'">
        Show password
      </label>
      {% if error %}<div class="err">⚠ {{ error }}</div>{% endif %}
      <button type="submit" class="btn">Sign In →</button>
    </form>
    <div class="divider">new here?</div>
    <div class="foot"><a href="/register">Create a free account</a></div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
}

/* Layout */
.main-container {
    display: flex;
    height: 100vh;
}

/* LEFT PANEL */
.sidebar {
    width: 30%;
    border-right: 1px solid #334155;
    overflow-y: auto;
    padding: 15px;
}

.history-box {
    background-color: #1e293b;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
}

/* RIGHT PANEL */
.chat-area {
    width: 70%;
    display: flex;
    flex-direction: column;
}

/* Header */
.top-bar {
    padding: 10px 15px;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Messages */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* Input */
.input-area {
    padding: 15px;
    border-top: 1px solid #334155;
    background-color: #1e293b;
}

/* Styles */
.user-box {
    background-color: #1e40af;
    padding: 10px;
    border-radius: 10px;
    text-align: right;
    margin-top: 10px;
}

.response-box {
    background-color: #020617;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    border: 1px solid #ffffff;
}

.input-box {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: white;
}

.btn-ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

/* 3 dots */
.msg-wrapper {
    position: relative;
}
.menu-btn {
    position: absolute;
    top: 5px;
    right: 5px;
}
</style>
</head>

<body>

<div class="main-container">

    <!-- LEFT SIDE -->
    <div class="sidebar">
        <h5>🕘 History</h5>

        {% for msg in chat %}
        <div class="history-box">
            <small><b>You:</b> {{ msg.user }}</small>
        </div>
        {% endfor %}
    </div>

    <!-- RIGHT SIDE -->
    <div class="chat-area">

        <!-- Top -->
        <div class="top-bar">
            <h5>🤖 AI Assistant</h5>
            <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
        </div>

        <!-- Messages -->
        <div class="messages" id="chatBox">

            {% for msg in chat %}

            <div class="msg-wrapper">

                <!-- ⋮ MENU -->
                <div class="dropdown menu-btn">
                    <button class="btn btn-sm text-white" data-bs-toggle="dropdown">⋮</button>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li>
                            <form method="POST" action="/delete_message/{{ msg.id }}" onsubmit="return confirmOneDelete();">
                                <button class="dropdown-item text-danger">Delete</button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- USER -->
                <div class="user-box">
                    {{ msg.user }}
                </div>

                <!-- BOT -->
                {% if msg.type == "text" %}
                <div class="response-box">
                    {{ msg.bot | safe }}
                </div>
                {% endif %}

                {% if msg.type == "image" %}
                <div class="response-box text-center">
                    <img src="{{ msg.image }}" style="max-width:100%; border-radius:10px;">
                </div>
                {% endif %}

            </div>

            {% endfor %}

        </div>

        <!-- Input -->
        <div class="input-area">
            <form method="POST" action="/tool">
                <div class="input-group">
                    <input class="form-control input-box" name="input" placeholder="Ask anything..." required>
                    <button class="btn btn-ai text-white">Send</button>
                </div>
            </form>
        </div>

    </div>

</div>

<!-- Bootstrap JS (required for dropdown) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Scroll Save -->
<script>
const chatBox = document.getElementById("chatBox");

if (chatBox) {
    chatBox.addEventListener("scroll", function() {
        sessionStorage.setItem("scrollPos", chatBox.scrollTop);
    });

    window.onload = function() {
        const saved = sessionStorage.getItem("scrollPos");
        if (saved !== null) {
            chatBox.scrollTop = saved;
        } else {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    };
}

/* Confirm single delete */
function confirmOneDelete() {
    return confirm("Delete this message?");
}
</script>

</body>
</html>

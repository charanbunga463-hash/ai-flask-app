<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tool</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#0f172a;
    color:#e2e8f0;
    font-family:'Segoe UI',sans-serif;
}

/* ICON */
.main-icon{
    position:fixed;
    top:10px;
    left:10px;
    font-size:22px;
    background:#1e293b;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    z-index:1100;
}

/* SIDEBAR */
.sidebar{
    width:280px;
    background:#0f172a;
    border-right:1px solid #334155;
    height:100vh;
    position:fixed;
    left:-280px;
    top:0;
    transition:.3s;
    z-index:1000;
    padding:15px;
    display:flex;
    flex-direction:column;
}
.sidebar.open{ left:0; }

.sidebar-content{
    flex:1;
    overflow-y:auto;
}

/* CHAT */
.chat-area{
    display:flex;
    flex-direction:column;
    height:100vh;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

/* INPUT */
.input-area{
    padding:15px;
    border-top:1px solid #334155;
    background:#1e293b;
}

/* BUBBLES */
.user-box{
    background:#1e40af;
    padding:10px;
    border-radius:10px;
    text-align:right;
    margin-top:10px;
}
.response-box{
    background:#020617;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    border:1px solid #334155;
}

/* HISTORY / SEARCH RESULTS */
.history-box{
    background:#1e293b;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
}
.history-box:hover{
    background:#334155;
}

/* SEARCH */
.search-box{
    margin:10px 0;
}

/* FOOTER */
.sidebar-footer{
    border-top:1px solid #334155;
    padding-top:10px;
}

/* HIGHLIGHT */
.highlight{
    background:yellow;
    color:black;
    padding:2px;
    border-radius:3px;
}

/* FILE MENU */
.file-menu{
    position:absolute;
    bottom:45px;
    left:0;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:10px;
    padding:5px;
    display:flex;
    flex-direction:column;
}
.file-menu button{
    background:none;
    border:none;
    color:white;
    padding:8px;
}
.file-menu button:hover{
    background:#334155;
}

.mic-active{
    background:red !important;
    color:white !important;
}
</style>
</head>

<body>

<div id="mainIcon" class="main-icon">🤖</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

    <div class="d-flex justify-content-between">
        <h5>Chats</h5>
        <button class="btn btn-sm btn-outline-light" id="closeBtn">✖</button>
    </div>

    <div class="sidebar-content">

        <a href="/new_chat" class="btn btn-primary w-100 mt-2 mb-2">+ New Chat</a>

        <!-- SEARCH -->
        <input type="text" id="searchBox" class="form-control search-box" placeholder="Search messages...">

        <!-- SEARCH RESULTS -->
        <div id="searchResults"></div>

        <!-- NORMAL HISTORY -->
        <div id="chatHistory">
        {% for conv in conversations %}
            <div class="history-box">
                <a href="/chat/{{ conv[0] }}" style="color:white;text-decoration:none;">
                    {{ conv[1] }}
                </a>
            </div>
        {% endfor %}
        </div>

    </div>

    <div class="sidebar-footer">
        <a href="/logout" class="btn btn-outline-danger w-100">Logout</a>
    </div>

</div>

<!-- CHAT -->
<div class="chat-area">

    <div class="messages" id="chatBox">
        {% for msg in chat %}
            <div class="user-box">{{ msg.user }}</div>

            {% if msg.type == "text" %}
                <div class="response-box">{{ msg.bot | safe }}</div>
            {% endif %}

            {% if msg.type == "image" %}
                <div class="response-box text-center">
                    <img src="{{ msg.image }}" style="max-width:100%; border-radius:10px;">
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <div class="input-area">
        <form method="POST" action="/tool" enctype="multipart/form-data">
            <div class="input-group">

                <button type="button" class="btn btn-outline-light" onclick="toggleMenu()">➕</button>

                <input type="file" id="fileInput" name="file" class="d-none">

                <input class="form-control"
                       id="chatInput"
                       name="input"
                       placeholder="Ask anything...">

                <button type="button" id="micBtn" class="btn btn-outline-light">🎤</button>
                <button class="btn btn-primary">Send</button>

            </div>
        </form>

        <div id="fileMenu" class="file-menu d-none">
            <button onclick="openFile()">📄 Upload File</button>
            <button onclick="openImage()">🖼 Upload Image</button>
        </div>
    </div>

</div>

<script>

// SIDEBAR
const sidebar = document.getElementById("sidebar");
document.getElementById("mainIcon").onclick = () => sidebar.classList.add("open");
document.getElementById("closeBtn").onclick = () => sidebar.classList.remove("open");

// AUTO SCROLL
window.onload = () => {
    let box = document.getElementById("chatBox");
    if(box) box.scrollTop = box.scrollHeight;
};

// 🔍 REAL SEARCH
const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("searchResults");
const historyDiv = document.getElementById("chatHistory");

searchBox.addEventListener("input", async function(){
    let q = this.value.trim();

    if(q.length < 2){
        resultsDiv.innerHTML = "";
        historyDiv.style.display = "block";
        return;
    }

    historyDiv.style.display = "none";

    let res = await fetch(`/search?q=${encodeURIComponent(q)}`);
    let data = await res.json();

    let html = "";

    data.results.forEach(r => {
        let regex = new RegExp(`(${q})`, "gi");

        let text = r.snippet.replace(regex,
            `<span class="highlight">$1</span>`);

        html += `
            <div class="history-box" onclick="openChat(${r.conv_id})">
                ${text}...
            </div>
        `;
    });

    resultsDiv.innerHTML = html;
});

function openChat(id){
    window.location.href = "/chat/" + id;
}

// FILE MENU
function toggleMenu(){
    document.getElementById("fileMenu").classList.toggle("d-none");
}
function openFile(){
    let f = document.getElementById("fileInput");
    f.accept = ".pdf";
    f.click();
}
function openImage(){
    let f = document.getElementById("fileInput");
    f.accept = "image/*";
    f.click();
}

// VOICE
let recognition, isListening=false;
const micBtn = document.getElementById("micBtn");

micBtn.onclick = () => {
    if(!('webkitSpeechRecognition' in window)){
        alert("Voice not supported");
        return;
    }

    if(isListening){
        recognition.stop();
        return;
    }

    recognition = new webkitSpeechRecognition();
    recognition.start();

    micBtn.classList.add("mic-active");
    isListening = true;

    recognition.onresult = e => {
        chatInput.value = e.results[0][0].transcript;
    };

    recognition.onend = () => {
        micBtn.classList.remove("mic-active");
        isListening = false;
    };
};

</script>

</body>
</html>
